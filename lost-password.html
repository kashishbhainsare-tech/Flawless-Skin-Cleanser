<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lost Password - Skin Cleanser Store</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f1f1f1;
        }

        .forgot-box {
            width: 360px;
            background: #ffffff;
            border: 1px solid #d6d6d6;
        }

        .info-box {
            width: 360px;
            background: #ffffff;
            border: 1px solid #d6d6d6;
            border-left: 5px solid #72aee6;
        }

        .input-box {
            height: 40px;
            border-color: #999;
        }

        .input-box:focus {
            border-color: #2271b1;
            box-shadow: 0 0 0 1px #2271b1;
        }

        .password-btn {
            background-color: #2271b1;
            border-color: #2271b1;
        }

        .password-btn:hover {
            background-color: #135e96;
            border-color: #135e96;
        }

        .forgot-links {
            width: 412px;
        }

        .forgot-links a {
            color: #2271b1;
            text-decoration: none;
        }

        .forgot-links a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <!-- ================= FORGOT PASSWORD ================= -->

    <main class="min-vh-100 d-flex flex-column align-items-center pt-5">


        <!-- LOGO -->

        <img
            src="images/logo/logo-w.svg"
            alt="Skin Cleanser Store"
            class="mb-4"
            style="width:85px;">


        <!-- INFORMATION BOX -->

        <div class="info-box p-3 mb-4">

            <p class="mb-0">

                Please enter your username or email address.
                You will receive an email message with
                instructions on how to reset your password.

            </p>

        </div>


        <!-- FORM -->

        <form
            class="forgot-box p-4"
            action="#"
            method="post">


            <!-- USERNAME -->

            <div class="mb-4">

                <label
                    for="username"
                    class="form-label fs-5">

                    Username or Email Address

                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control input-box"
                    required>

            </div>


            <!-- BUTTON -->

            <div class="text-end">

                <button
                    type="submit"
                    class="btn btn-primary password-btn px-3 py-2">

                    Get New Password

                </button>

            </div>


        </form>


        <!-- LINKS -->

        <div class="forgot-links mt-4">


            <!-- LOG IN -->

            <p class="mb-4">

                <a href="user.html">

                    Log in

                </a>

            </p>


            <!-- HOME -->

            <p>

                <a href="index.html">

                    ← Go to Skin Cleanser Store

                </a>

            </p>


        </div>


    </main>


</body>

</html>
