<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In - Skin Cleanser Store</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f1f1f1;
        }

        .login-box {
    width: 360px;
    background: #ffffff;
    border: 1px solid #d6d6d6;
    padding: 25px !important;
}

        .login-input {
            height: 40px;
            border-color: #999;
        }

        .login-input:focus {
            border-color: #2271b1;
            box-shadow: 0 0 0 1px #2271b1;
        }

        .login-btn {
            background-color: #2271b1;
            border-color: #2271b1;
        }

        .login-btn:hover {
            background-color: #135e96;
            border-color: #135e96;
        }

        .login-links {
            width: 360px;
        }

        .login-links a {
            color: #2271b1;
            text-decoration: none;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <!-- ================= LOGIN SECTION ================= -->

    <main class="min-vh-100 d-flex flex-column align-items-center pt-5">


        <!-- WORDPRESS LOGO -->

        <img src="images/logo/logo-w.svg"
     alt="Skin Cleanser Store"
     class="mb-4"
     style="width:85px;">

        <!-- LOGIN BOX -->

           <form class="login-box p-4">

    <div class="mb-4">

        <label 
            for="username"
            class="form-label fs-5">

            Username or Email Address

        </label>

        <input 
            type="text"
            id="username"
            class="form-control login-input"
            required>

    </div>


    <div class="mb-4">

        <label 
            for="password"
            class="form-label fs-5">

            Password

        </label>

        <div class="input-group">

            <input 
                type="password"
                id="password"
                class="form-control login-input"
                required>

            <button 
                type="button"
                class="btn btn-light border"
                onclick="showPassword()">

                <i 
                    id="eyeIcon"
                    class="bi bi-eye">
                </i>

            </button>

        </div>

    </div>


    <div class="d-flex justify-content-between align-items-center">

        <div class="form-check">

            <input 
                type="checkbox"
                class="form-check-input"
                id="remember">

            <label 
                class="form-check-label fs-5"
                for="remember">

                Remember Me

            </label>

        </div>


        <button 
            type="submit"
            class="btn btn-primary login-btn px-3 py-2">

            Log In

        </button>

    </div>

</form>

        <!-- LINKS -->

        <div class="login-links mt-4">

            <p class="mb-4">

                <a href="lost-password.html">

                    Lost your password?

                </a>

            </p>


            <p>

                <a href="index.html">

                    ← Go to Skin Cleanser Store

                </a>

            </p>

        </div>


    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function showPassword() {

            let password =
                document.getElementById("password");

            let eyeIcon =
                document.getElementById("eyeIcon");


            if (password.type === "password") {

                password.type = "text";

                eyeIcon.className = "bi bi-eye-slash";

            }

            else {

                password.type = "password";

                eyeIcon.className = "bi bi-eye";

            }

        }

    </script>


</body>

</html>
